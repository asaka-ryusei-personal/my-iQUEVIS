services:
  db:
    image: postgres:15
    container_name: myiquevis-db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/initialize.sql:/docker-entrypoint-initdb.d/initialize.sql
    networks:
      - myiquevis-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myiquevis-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mydb
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: mypassword
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - myiquevis-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: myiquevis-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - myiquevis-net

networks:
  myiquevis-net:
    driver: bridge
